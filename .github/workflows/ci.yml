# MM-41 CI: release build with warnings as errors, then the test suite
# (cases, golden transcripts, scripts, tutor) under AddressSanitizer, the
# fuzzer and the out-of-memory test.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev libreadline-dev
      - name: release build
        run: make -j4
      - name: test suite (ASan build)
        run: make test
      - name: fuzz (random sessions, damaged files)
        run: make fuzz FUZZ_N=1000
      - name: out of memory (every command, each allocation failed in turn)
        run: make nomem

  # The browser build: MM-41 and GSL compiled to WebAssembly with the
  # distribution's Emscripten, the golden files run through it under node,
  # and the page driven in Chromium.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev libreadline-dev emscripten
      - name: native build (generates the sources the web build shares)
        run: make -j4
      - name: web build
        run: make web
      - name: golden files through the WebAssembly build
        run: node web/test.mjs
      - name: the page in a browser
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
          MM41_REQUIRE_BROWSER=1 NODE_PATH="$RUNNER_TEMP/pw/node_modules" node web/page.test.mjs

  # The golden transcripts are not run here yet: three of them (income, ode,
  # survival) differ from the Linux output in the last printed digits.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: brew install gsl readline
      - name: release build
        run: make -j4
      - name: ASan build
        run: make asan examples/modules/hello/hello.so
      - name: case tests
        run: bash tests/run_tests.sh
      - name: script tests
        run: ASAN_OPTIONS=detect_leaks=0 sh tests/run_scripts.sh bin/asan/mm41
      - name: tutor
        run: ASAN_OPTIONS=detect_leaks=0 ./bin/asan/mm41 --tutor-check
